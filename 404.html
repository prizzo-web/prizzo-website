<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | PRIZZO WEB DESIGN</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #111;
            color: white;
            padding: 20px;
        }

        .error-box {
            max-width: 600px;
        }

        .error-box h1 {
            font-size: 100px;
            margin-bottom: 10px;
        }

        .error-box h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .error-box p {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #fff;
            color: #111;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .home-btn:hover {
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .error-box h1 {
                font-size: 75px;
            }

            .error-box h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="error-box">
        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you're looking for doesn't exist.
        </p>

        <a href="index.html" class="home-btn">← Back to Home</a>
    </div>

</body>
</html>
